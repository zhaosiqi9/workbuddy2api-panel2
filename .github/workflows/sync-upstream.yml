name: Sync fork with upstream

on:
  schedule:
    - cron: "0 */6 * * *"   # 每 6 小时同步一次
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote remove upstream || true
          git remote add upstream https://github.com/misakano7545/workbuddy2api-panel.git
          git fetch upstream --prune

      - name: Sync fork with upstream while preserving local changes
        run: |
          git checkout main
          git fetch origin
          git merge --no-edit upstream/main || {
            echo "::error::Merge conflict detected while syncing upstream. Local changes are preserved."
            git status --short
            exit 1
          }
          git push origin main
